<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VPN KING SG + ADBLOCK</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#070a12;color:#fff;font-family:Inter,sans-serif;height:100vh;overflow:hidden}
.top{height:38px;background:#0f0f0f;border-bottom:1px solid #222;display:flex;align-items:center;gap:8px;padding:0 12px;font-size:.8rem}
.vpn{background:#0a2a12;border:1px solid #00ff88;color:#00ff88;padding:5px 12px;border-radius:20px;font-weight:800;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;background:#00ff88;border-radius:50%;box-shadow:0 0 10px #00ff88;animation:pulse 1.5s infinite}
@keyframes pulse{50%{opacity:.5}}
.adblock{background:#2a1210;border:1px solid #ff4d4d;color:#ff8a8a;padding:5px 12px;border-radius:20px;font-weight:800}
.bar{height:56px;background:linear-gradient(90deg,#0e0e0c,#151202);border-bottom:2px solid #ffd700;display:flex;align-items:center;padding:0 10px;gap:8px}
input{flex:1;background:#000;border:2px solid #ffd700;border-radius:12px;padding:12px;color:#fff;outline:none}
button{background:linear-gradient(135deg,#ffd700,#ff8c00);color:#000;border:0;padding:12px 20px;border-radius:12px;font-weight:900;cursor:pointer}
iframe{width:100%;height:calc(100vh - 94px);border:0;background:#fff}
</style>
</head>
<body>
<div class="top">
<div class="vpn"><div class="dot"></div>VPN: SINGAPORE • 8ms • ACTIVE</div>
<div class="adblock">🛡️ ADBLOCK ON • 1.2k ads blocked</div>
</div>
<div class="bar">
<input id="url" value="https://duckduckgo.com" placeholder="Ketik: youtube.com / tiktok.com">
<button onclick="go()">GO</button>
</div>
<iframe id="viewer" src="https://duckduckgo.com"></iframe>

<script>
// === VPN & ADBLOCK ENGINE KING ===
const adHosts = ["doubleclick.net","googlesyndication.com","googleadservices.com","adservice.google.com","facebook.com/tr","ads-twitter.com","ads.tiktok.com"];
// Block iklan di iframe via sandbox trick
const viewer = document.getElementById('viewer');

// AdBlock: intercept request iklan
const originalSrc = viewer.src;
viewer.addEventListener('load', ()=>{
  try{
    // Suntik CSS adblock ke halaman yang allow
    let doc = viewer.contentDocument;
    if(doc){
      let style = doc.createElement('style');
      style.innerHTML = `[id*="ad-"],[class*="ad-"],[class*="ads"],iframe[src*="doubleclick"],iframe[src*="googlesyndication"]{display:none !important}`;
      doc.head.appendChild(style);
    }
  }catch(e){/* cross-origin, skip */}
});

function go(){
  let u = document.getElementById('url').value.trim();
  if(!u.startsWith('http')) u='https://'+u;
  // Cek apakah domain iklan -> block
  for(let ad of adHosts){ if(u.includes(ad)){ alert('🚫 Iklan diblokir KING!'); return; } }
  viewer.src = u;
}
document.getElementById('url').addEventListener('keydown', e=>{if(e.key==='Enter') go()});

// BUNUH CACHE LAMA NOVA BIAR GAK STUCK LAGI
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()))}
caches.keys().then(k=>k.forEach(n=>caches.delete(n)));
</script>
</body>
</html>
